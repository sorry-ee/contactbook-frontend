<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Soul 通讯录</title><link rel="stylesheet" href="style.css"><script defer src="xlsx.full.min.js"></script><script defer src="excel.js"></script><script defer src="app.js"></script></head>
<body><aside><a class="brand" href="/">Soul<span>通讯录</span></a><nav><button id="all" class="active">◉　全部联系人 <b id="all-count">0</b></button><button id="favorites">☆　收藏联系人 <b id="fav-count">0</b></button></nav><div class="aside-bottom"><span class="dot"></span> 数据保存在服务器<br><small>云端数据库 · 当前浏览器独立通讯录<br>清除 Cookie 或更换浏览器后将无法访问原通讯录，请定期导出备份。</small></div></aside>
<main><header><div class="heading"><div><h1 id="view-title">全部联系人</h1></div><button class="primary" id="new">＋ 新建联系人</button></div></header>
<section class="toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="搜索姓名、电话、邮箱…" aria-label="搜索联系人"></label><div class="tools"><a href="/api/template">下载模板</a><button id="import">↥ 导入 Excel</button><a class="button" href="/api/export">↧ 导出 Excel</a><input type="file" id="file" accept=".xlsx" hidden></div></section>
<div id="notice" role="status" aria-live="polite"></div><div class="list-heading"><span id="result-count">0 位联系人</span></div><section id="list" class="cards" aria-label="联系人列表"></section><footer>Soul 通讯录</footer></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><div><h2 id="editor-title">新建联系人</h2></div><button type="button" id="close" aria-label="关闭">×</button></div><label>姓名 <span class="required">*</span><input name="name" required maxlength="100" placeholder="请输入姓名"></label><label class="check"><input type="checkbox" name="favorite"> 加入收藏联系人</label><div class="form-grid"><label>手机号<textarea name="phones" placeholder="每行填写一个手机号" rows="3"></textarea></label><label>邮箱<textarea name="emails" placeholder="每行填写一个邮箱" rows="3"></textarea></label><label>社交账号<textarea name="socials" placeholder="每行一条，如 微信：example" rows="3"></textarea></label><label>通讯地址<textarea name="addresses" placeholder="每行填写一个地址" rows="3"></textarea></label></div><label>备注<textarea name="notes" maxlength="2000" placeholder="备注（可选）" rows="2"></textarea></label><p id="form-error" role="alert"></p><div class="dialog-actions"><button id="cancel" type="button">取消</button><button class="primary" id="save">保存联系人</button></div></form></dialog>
<dialog id="delete-dialog"><h2>删除联系人？</h2><p>此操作无法撤销，建议先导出备份。</p><div class="dialog-actions"><button id="keep">取消</button><button id="confirm-delete" class="danger">确认删除</button></div></dialog>
</body></html>
